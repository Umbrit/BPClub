<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BP Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Cinzel:wght@700;900&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="crest" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M8 22 L18 34 L32 12 L46 34 L56 22 L52 50 H12 Z" fill="var(--gold)" stroke="var(--gold-deep)" stroke-width="2" stroke-linejoin="round"/>
          <rect x="12" y="50" width="40" height="7" rx="2" fill="var(--gold-deep)"/>
        </svg>
        <h1 id="clubName">BP Club</h1>
      </div>
      <div class="top-actions">
        <button class="btn ghost teacher-only" id="endLessonBtn" type="button">End lesson</button>
        <button class="btn gold" id="lockBtn" type="button">Teacher login</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button type="button" data-tab="board" class="tab active">Leaderboard</button>
      <button type="button" data-tab="award" class="tab teacher-only">Give BP</button>
      <button type="button" data-tab="shop" class="tab">Power-ups<span class="count teacher-only" id="brownieCount" title="Brownies owed" hidden>0</span></button>
      <button type="button" data-tab="students" class="tab teacher-only">Students</button>
      <button type="button" data-tab="history" class="tab">History</button>
      <button type="button" data-tab="settings" class="tab teacher-only">Settings</button>
    </nav>
  </header>

  <main class="wrap">
    <section id="tab-board" class="panel active" aria-label="Leaderboard">
      <div class="podium" id="podium"></div>
      <div class="board-card" id="boardCard">
        <h2 class="list-head">Subjects</h2>
        <ol class="board" id="board"></ol>
      </div>
      <div class="empty" id="boardEmpty" hidden>
        <p>No students yet.</p>
        <div class="btn-row teacher-only">
          <button class="btn gold" id="emptyAdd" type="button">Add students</button>
          <button class="btn ghost" id="emptyExample" type="button">Load example class</button>
        </div>
      </div>
    </section>

    <section id="tab-award" class="panel" aria-label="Give BP">
      <div class="award-layout">
        <div class="card">
          <div class="card-head">
            <h2>Students <span id="selCount"></span></h2>
            <div class="btn-row">
              <button class="btn small ghost" id="selAll" type="button">All</button>
              <button class="btn small ghost" id="selNone" type="button">None</button>
            </div>
          </div>
          <div class="chips" id="awardChips"></div>
        </div>
        <div class="card award-controls">
          <div class="amounts" id="plusAmounts"></div>
          <div class="amounts" id="minusAmounts"></div>
          <form class="inline-form" id="customForm">
            <input id="customAmount" type="number" step="0.5" placeholder="Other amount" aria-label="Other amount">
            <button class="btn gold" type="submit">Apply</button>
          </form>
          <input id="awardReason" type="text" maxlength="80" placeholder="Reason (optional)" aria-label="Reason" list="reasonList">
          <datalist id="reasonList">
            <option value="Great answer"></option>
            <option value="Homework"></option>
            <option value="Helping others"></option>
            <option value="Quiz winner"></option>
            <option value="Off task"></option>
          </datalist>
        </div>
      </div>
    </section>

    <section id="tab-shop" class="panel" aria-label="Power-ups">
      <div class="shop" id="shop"></div>
      <div class="card teacher-only" id="brownieCard" hidden>
        <h2>Brownies owed</h2>
        <ul class="list" id="browniePending"></ul>
      </div>
    </section>

    <section id="tab-students" class="panel" aria-label="Students">
      <div class="student-layout">
        <form class="card" id="addForm">
          <h2>Add students</h2>
          <textarea id="addNames" rows="6" placeholder="One name per line" aria-label="Student names"></textarea>
          <button class="btn gold" type="submit">Add</button>
        </form>
        <div class="card">
          <h2>Class <span id="studentTotal"></span></h2>
          <div class="table-scroll">
            <table>
              <thead><tr><th>Name</th><th class="num">BP</th><th></th></tr></thead>
              <tbody id="studentRows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <section id="tab-history" class="panel" aria-label="History">
      <div class="card">
        <div class="card-head">
          <h2>History</h2>
          <button class="btn small ghost teacher-only" id="undoBtn" type="button">Undo last</button>
        </div>
        <ul class="log" id="log"></ul>
      </div>
    </section>

    <section id="tab-settings" class="panel" aria-label="Settings">
      <div class="settings-grid">
        <div class="card">
          <h2>Club</h2>
          <label class="field"><span>Name</span><input id="setName" type="text" maxlength="40"></label>
          <form class="inline-form" id="pinForm">
            <label class="field"><span>Teacher PIN</span><input id="setPin" type="password" inputmode="numeric" autocomplete="new-password" minlength="3" maxlength="12" placeholder="New PIN"></label>
            <button class="btn ghost" type="submit">Change</button>
          </form>
        </div>

        <div class="card">
          <h2>Power-ups</h2>
          <table class="pu-table">
            <thead><tr><th></th><th class="num">Price</th><th class="num">On</th></tr></thead>
            <tbody id="setPowerups"></tbody>
          </table>
        </div>

        <div class="card span-2">
          <div class="card-head">
            <h2>Wheel slices</h2>
            <div class="btn-row">
              <button class="btn small ghost" id="wheelReset" type="button">Reset</button>
              <button class="btn small gold" id="wheelAdd" type="button">Add slice</button>
            </div>
          </div>
          <div class="table-scroll">
            <table class="wheel-table">
              <thead><tr><th>Label</th><th>Effect</th><th class="num">BP</th><th></th></tr></thead>
              <tbody id="wheelRows"></tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <h2>Backup</h2>
          <p class="muted small">Saved in this browser only.</p>
          <div class="btn-row">
            <button class="btn ghost" id="exportBtn" type="button">Download</button>
            <label class="btn ghost file-btn">Restore<input id="importFile" type="file" accept="application/json,.json"></label>
          </div>
        </div>

        <div class="card">
          <h2>Reset</h2>
          <div class="btn-row">
            <button class="btn ghost" id="resetPointsBtn" type="button">Set all BP to 0</button>
            <button class="btn danger" id="wipeBtn" type="button">Delete everything</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" id="modalClose" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
